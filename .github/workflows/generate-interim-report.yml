name: Generate interim final-style report

on:
  push:
    paths:
      - 'scripts/generate_interim_report_pdf.py'
      - '.github/workflows/generate-interim-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF dependency
        run: python3 -m pip install --disable-pip-version-check reportlab

      - name: Generate report
        run: python3 scripts/generate_interim_report_pdf.py

      - name: Commit report and recovery chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/interim_415
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "report: generate final-style interim report for 415 verified claims"
            git push
          fi
