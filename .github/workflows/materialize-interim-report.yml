name: Materialize interim report payload

on:
  push:
    paths:
      - 'scripts/materialize_interim_report.py'
      - '.github/workflows/materialize-interim-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize current verified subset
        run: python3 scripts/materialize_interim_report.py

      - name: Commit report payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/interim_415
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "analysis: materialize interim report payload"
            git push
          fi
