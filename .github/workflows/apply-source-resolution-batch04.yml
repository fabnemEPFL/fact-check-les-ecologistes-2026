name: Apply source resolution batch 04

on:
  push:
    paths:
      - '.github/workflows/apply-source-resolution-batch04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate batch 04
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          src = gzip.decompress(base64.b64decode(pathlib.Path('.batch04_apply.py.gz.b64').read_text()))
          pathlib.Path('/tmp/apply_batch04.py').write_bytes(src)
          PY
          python3 /tmp/apply_batch04.py
          python3 - <<'PY'
          import json, pathlib
          latest=json.loads(pathlib.Path('checkpoints/latest.json').read_text())
          sr=latest['source_resolution']
          assert sr['sources_unique_problematic_at_start']==87
          assert sr['sources_resolved_this_run']==50
          assert sr['sources_unresolved_after_batch']==37
          assert sr['claims_still_problem_non_resolved']==38
          assert pathlib.Path('checkpoints/'+latest['authoritative_recovery_source']['name']).exists()
          print(json.dumps(sr, ensure_ascii=False))
          PY

      - name: Commit authoritative state
        run: |
          rm -f .batch04_apply.py.gz.b64 .github/workflows/apply-source-resolution-batch04.yml
          git config user.name "fabnemEPFL"
          git config user.email "117652591+fabnemEPFL@users.noreply.github.com"
          git add analysis/source_registry_final.json analysis/final_cleanup_changes.jsonl metrics/compute_log.jsonl checkpoints/latest.json checkpoints/final_cleanup_2026-09-08_source_resolution_batch_04.json.xz.b64 .batch04_apply.py.gz.b64 .github/workflows/apply-source-resolution-batch04.yml
          git commit -m "fix: resolve 50 problematic sources (batch 04)"
          git push origin HEAD:main
